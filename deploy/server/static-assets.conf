# Public build files only; private project uploads still require API authorization.
location ^~ /assets/ {
    root /opt/web-radar/current/dist;
    try_files $uri =404;
    limit_except GET { deny all; }
    etag on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip_static on;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
}
