# Public build files only; private project uploads still require API authorization.
location ^~ /templates/ {
    root /opt/web-radar/current/dist;
    try_files $uri =404;
    limit_except GET { deny all; }
    etag on;
    add_header Cache-Control "public, max-age=3600";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
}
