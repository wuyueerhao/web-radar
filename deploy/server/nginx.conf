server {
    listen 80;
    server_name web.vnvnv.com server.web-radar.net;
    location /.well-known/acme-challenge/ { root /var/www/web-radar-acme; }
    location / { return 301 https://web.vnvnv.com$request_uri; }
}
server {
    listen 80;
    server_name *.sites-server.web-radar.net;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name server.web-radar.net;
    ssl_certificate /etc/letsencrypt/live/web-radar-server/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-radar-server/privkey.pem;
    return 308 https://web.vnvnv.com$request_uri;
}
server {
    listen 443 ssl;
    server_name web.vnvnv.com;
    ssl_certificate /etc/letsencrypt/live/web-radar-main/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-radar-main/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    location ^~ /builder/ {
        proxy_pass http://127.0.0.1:7002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
server {
    listen 443 ssl;
    server_name *.sites-server.web-radar.net;
    ssl_certificate /etc/letsencrypt/live/web-radar-server/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-radar-server/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
server {
    listen 80;
    server_name public-server.web-radar.net;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name public-server.web-radar.net;
    ssl_certificate /etc/letsencrypt/live/web-radar-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web-radar-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
